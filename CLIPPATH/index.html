<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, inicial-scale=1.0">
    <title>Semana 4</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .header {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            padding: 8px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            transition: all 0.3s;
        }

        .header a:hover {
            background: rgba(255,255,255,0.4);
        }

        .contenido {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        .contenido a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .contenido a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="contenido">
        <a href="niño.html">ANIMACION NIÑO</a><br>
        <a href="animacionparallax.html">EFECTO PARALLAX</a><br>
        <a href="../index.html">volver</a><br>
    </div>
</body>
</html>
