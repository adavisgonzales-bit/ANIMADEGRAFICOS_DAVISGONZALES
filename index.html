<html>
<head>
    <title>ANIMACIONES CSS</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }

        .menu {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        a {
            display: block;
            text-decoration: none;
            padding: 12px 20px;
            margin: 10px 0;
            background: #667eea;
            color: white;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s;
        }

        a:hover {
            background: #764ba2;
            transform: translateX(5px);
        }
    </style>
</head>
